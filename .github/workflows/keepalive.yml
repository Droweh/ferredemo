name: Mantener Supabase activo

on:
  schedule:
    # Cada 3 días. Supabase Free pausa un proyecto tras 7 días sin actividad.
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar API de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Faltan los secretos SUPABASE_URL o SUPABASE_PUBLISHABLE_KEY. No se hizo el ping."
            exit 0
          fi

          endpoint="${SUPABASE_URL%/}/rest/v1/products?select=id&limit=1"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/ferromax-ping.json -w '%{http_code}' \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "$endpoint" || true)
            echo "Intento $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/ferromax-ping.json
              exit 0
            fi
            sleep 15
          done

          echo "::error::Supabase no respondió correctamente. Revisá si el proyecto está pausado."
          exit 1
