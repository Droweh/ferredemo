name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Pruebas de seguridad
        run: npm run test:security

      - name: Pruebas de navegador
        run: npm run test:e2e

      - name: Guardar reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Desplegar
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar configuración pública
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const url = String(process.env.SUPABASE_URL || '').trim().replace(/\/+$/, '');
          const key = String(process.env.SUPABASE_PUBLISHABLE_KEY || '').trim();
          const turnstile = String(process.env.TURNSTILE_SITE_KEY || '').trim();

          function isSecretKey(value) {
            if (!value) return false;
            if (/service_role/i.test(value) || value.startsWith('sb_secret_')) return true;
            if (value.startsWith('eyJ')) {
              try {
                const payload = JSON.parse(
                  Buffer.from(value.split('.')[1], 'base64url').toString('utf8')
                );
                return payload.role === 'service_role';
              } catch {
                return false;
              }
            }
            return false;
          }

          if (isSecretKey(key)) {
            console.error('La clave cargada es secreta (service_role / sb_secret_). Usá la publishable key / anon public key.');
            process.exit(1);
          }

          if (url && !/^https:\/\/[^/\s]+$/i.test(url)) {
            console.error('SUPABASE_URL no tiene el formato esperado (https://proyecto.supabase.co).');
            process.exit(1);
          }

          if (!url || !key) {
            console.log('::warning::Faltan SUPABASE_URL o SUPABASE_PUBLISHABLE_KEY. Se publicará en modo local.');
          }

          const config = {
            mode: url && key ? 'supabase' : 'local',
            supabaseUrl: url,
            supabaseAnonKey: key,
            turnstileSiteKey: turnstile,
          };

          fs.writeFileSync(
            'public/js/config.js',
            `/* Generado por GitHub Actions. */\nwindow.FERROMAX_CONFIG = ${JSON.stringify(config, null, 2)};\n`,
            'utf8'
          );
          console.log(`FerreDemo configurado en modo ${config.mode}.`);
          NODE

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
